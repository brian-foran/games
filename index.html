<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172554">
    <meta name="description" content="A collection of quick, fun games to play together.">
    <title>Games</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #172554;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background:
          radial-gradient(ellipse at 85% 10%, #dbeafe 0, transparent 34rem),
          #f8fafc;
      }

      main { width: min(100%, 56rem); }

      .eyebrow {
        margin: 0 0 .75rem;
        color: #2563eb;
        font-size: .8rem;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 8vw, 5rem);
        letter-spacing: -.06em;
        line-height: 1;
      }

      .intro {
        max-width: 38rem;
        margin: 1rem 0 2.5rem;
        color: #475569;
        font-size: 1.15rem;
        line-height: 1.6;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
        gap: 1rem;
      }

      .game-card {
        display: flex;
        min-height: 14rem;
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem;
        border: 1px solid #dbeafe;
        border-radius: 1.25rem;
        background: #fff;
        box-shadow: 0 12px 30px #1725540b;
        color: inherit;
        text-decoration: none;
        transition: transform .18s ease, box-shadow .18s ease;
      }

      .game-card:hover, .game-card:focus-visible {
        transform: translateY(-4px);
        box-shadow: 0 18px 36px #17255417;
      }

      .game-card:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }

      .icon {
        display: grid;
        width: 3.25rem;
        height: 3.25rem;
        place-items: center;
        border-radius: 1rem;
        background: #eff6ff;
        font-size: 1.7rem;
      }

      h2 { margin: 1.1rem 0 .35rem; font-size: 1.35rem; }
      .description { margin: 0; color: #64748b; line-height: 1.5; }
      .play { margin-top: auto; padding-top: 1.25rem; color: #2563eb; font-weight: 750; }
      footer { margin-top: 2.5rem; color: #94a3b8; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The games room</p>
      <h1>Games</h1>
      <p class="intro">Pick a game, grab your friends, and let the good times roll.</p>

      <section class="games" aria-label="Available games">
        <a class="game-card" href="games/catchphrase/">
          <span class="icon" aria-hidden="true">⏱️</span>
          <h2>Catchphrase</h2>
          <p class="description">Describe the word, pass the device, and try not to be holding it when the buzzer goes.</p>
          <span class="play">Play now <span aria-hidden="true">→</span></span>
        </a>
      </section>

      <footer>More games coming soon.</footer>
    </main>
  </body>
</html>
